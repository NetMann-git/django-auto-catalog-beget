<!-- config/templates/includes/header.html -->
{% load static %}
<header class="site-header" data-site-header>
    <div class="header-inner">
        <a href="{% url 'home' %}" class="logo" aria-label="Подберем АВТО — на главную">
            <span>Подберем АВТО</span>
            <small>Автомобили из Кореи и Китая</small>
        </a>

        <nav class="main-nav" aria-label="Основная навигация">
            <a href="{% url 'home' %}" class="nav-link is-active">Главная</a>
            <a href="{% url 'catalog:catalog' %}" class="nav-link">Каталог</a>
            <a href="/#about" class="nav-link">О компании</a>
            <a href="/#process" class="nav-link">Как покупаем</a>
            <a href="/#inspection" class="nav-link">Осмотр</a>
            <a href="/#clients" class="nav-link">Клиенты</a>
        </nav>

        <div class="header-actions">
            <div id="search-container" class="header-search">
                <input type="text" id="search-input" placeholder="Поиск по каталогу..." autocomplete="off" aria-label="Поиск по каталогу">
                <div id="search-results" class="search-results" style="display:none;"></div>
            </div>

            <a href="{% url 'catalog:catalog' %}" class="btn btn-primary desktop-action">Подобрать авто</a>

            <a href="{% url 'wishlist:list' %}" class="nav-link" aria-label="Избранное">
                Избранное{% if wishlist_count %} <span class="badge-count" id="wishlist-count">{{ wishlist_count }}</span>{% endif %}
            </a>

            <button type="button" class="mobile-menu-toggle" aria-label="Открыть меню" aria-expanded="false" data-mobile-menu-toggle>
                <span></span>
            </button>
        </div>
    </div>

    <nav class="mobile-nav" aria-label="Мобильная навигация" data-mobile-nav>
        <a href="{% url 'home' %}" class="nav-link">Главная</a>
        <a href="{% url 'catalog:catalog' %}" class="nav-link">Каталог</a>
        <a href="/#about" class="nav-link">О компании</a>
        <a href="/#process" class="nav-link">Как покупаем</a>
        <a href="/#inspection" class="nav-link">Осмотр</a>
        <a href="/#clients" class="nav-link">Клиенты</a>
    </nav>
</header>
