{% load static %}
<article class="sppb-carousel-extended-item client-showcase-card">
 <div class="client-showcase-card__media">
  {% if client.image %}
   <img class="client-showcase-card__image" alt="{{ client.name }} — {{ client.vehicle }}" decoding="async" loading="lazy" src="{{ client.image.url }}" />
  {% endif %}
 </div>
 <div class="client-showcase-card__content">
  <div class="client-showcase-card__name">{{ client.name }}</div>
  <div class="client-showcase-card__vehicle">{{ client.vehicle }}</div>
 </div>
</article>
