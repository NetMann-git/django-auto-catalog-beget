<section class="cookie-preferences" id="cookie-settings" aria-label="Настройки cookies" hidden>
    <div class="cookie-preferences__body">
        <h2>Настройки cookies</h2>
        <p>Необходимые cookies обеспечивают вход на сайт и работу форм. Дополнительные функции включаются только с вашего разрешения.</p>
        <div class="cookie-preferences__options" data-cookie-options hidden>
            <label><input type="checkbox" checked disabled> Необходимые — всегда включены</label>
            <label><input type="checkbox" data-cookie-analytics> Аналитика</label>
            <label><input type="checkbox" data-cookie-external> Карта и видео со сторонних сайтов</label>
        </div>
        <div class="cookie-preferences__actions">
            <button type="button" data-cookie-necessary>Только необходимые</button>
            <button type="button" data-cookie-customize>Настроить</button>
            <button type="button" data-cookie-save hidden>Сохранить выбор</button>
            <button type="button" data-cookie-accept>Принять все</button>
        </div>
    </div>
</section>
