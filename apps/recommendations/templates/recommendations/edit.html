<!-- apps/recommendations/templates/recommendations/edit.html -->

{% extends 'users/consultant_dashboard.html' %}

{% block content %}
<div class="container">
    <h2 class="section-title">Редактирование рекомендации</h2>
    <form method="post" class="card p-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'recommendations:manage' %}" class="btn btn-ghost">Отмена</a>
    </form>
</div>
{% endblock %}
