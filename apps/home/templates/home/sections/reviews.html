{% if video_clients %}
<section class="sppb-section reviews-section" id="reviews">
 <div class="sppb-row-container">
  <div class="reviews-section__divider" aria-hidden="true"></div>
  <h5 class="reviews-section__eyebrow">Обратная связь</h5>
  <h2 class="reviews-section__title">Отзывы о нашей работе</h2>
  <div class="sppb-carousel-extended reviews-carousel"
       data-aria-next="Далее" data-aria-prev="Предыдущий"
       data-arrow="1" data-autoplay="0" data-dots="0" data-interval="4500"
       data-item-number-xl="4" data-item-number-lg="3" data-item-number-md="3"
       data-item-number-sm="3" data-item-number-xs="1"
       data-left-arrow="fa-angle-left" data-right-arrow="fa-angle-right"
       data-loop="true" data-margin-xl="12" data-pause-on-hover="0" data-speed="1500">
   {% for client in video_clients %}
    <article class="sppb-carousel-extended-item reviews-card">
     <div class="reviews-card__video">
      <iframe allow="clipboard-write; autoplay" allowfullscreen loading="lazy"
              src="{{ client.rutube_embed_url }}"
              title="Видео отзыва: {{ client.name }} — {{ client.vehicle }}"></iframe>
     </div>
     <div class="reviews-card__meta">
      <div class="reviews-card__name">{{ client.name }}</div>
      <div class="reviews-card__vehicle">{{ client.vehicle }}</div>
     </div>
    </article>
   {% endfor %}
  </div>
 </div>
</section>
{% endif %}
