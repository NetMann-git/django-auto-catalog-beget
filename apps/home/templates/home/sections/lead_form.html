<section class="home-callback" id="callback" aria-labelledby="callback-title">
  <div class="home-callback__container">
    <div class="home-callback__heading">
      <h3 class="home-callback__title" id="callback-title">Подберите авто прямо сейчас:</h3>
    </div>

    <div class="home-callback__form-wrap">
      <form
        class="home-callback__form"
        id="home-callback-form"
        method="post"
        action="{% url 'appointments:callback_submit' %}"
        novalidate
      >
        {% csrf_token %}

        <div class="home-callback__field" data-field="name">
          <label class="home-callback__sr-only" for="callback-name">Ваше имя</label>
          {{ callback_form.name }}
          <span class="home-callback__error" aria-live="polite"></span>
        </div>

        <div class="home-callback__field" data-field="phone">
          <label class="home-callback__sr-only" for="callback-phone">Номер телефона</label>
          {{ callback_form.phone }}
          <span class="home-callback__error" aria-live="polite"></span>
        </div>

        <div class="home-callback__honeypot" aria-hidden="true">
          <label for="callback-website">Ваш сайт</label>
          <input id="callback-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="home-callback__actions">
          <button class="home-callback__submit" id="btn-v78-callback" type="submit">
            Заказать звонок
          </button>
        </div>
      </form>

      <div class="home-callback__status" id="home-callback-status" role="status" aria-live="polite"></div>
    </div>
  </div>
</section>
