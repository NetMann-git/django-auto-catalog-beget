<!-- apps/recommendations/templates/recommendations/add.html -->

{% extends 'users/consultant_dashboard.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'products/css/manage.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1 class="page-title">Добавить товар в рекомендации</h1>
    </div>

    <form method="post" class="card">
        <div class="card-content">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'recommendations:manage' %}" class="btn btn-ghost">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
