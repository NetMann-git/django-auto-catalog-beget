{% load static %}
{% if team_members %}
<section class="home-team" id="team">
 <div class="home-team__container">
  <div class="home-team__divider" aria-hidden="true"></div>
  <h2 class="home-team__title">Наша команда</h2>
  <div class="home-team__grid">
   {% for member in team_members %}
   <article class="home-team-card">
    <div class="home-team-card__media">
     {% if member.image %}
      <img class="home-team-card__image" src="{{ member.image.url }}" alt="{{ member.name }} — {{ member.position }}" loading="lazy" decoding="async">
     {% elif member.legacy_image %}
      <img class="home-team-card__image" src="{% static member.legacy_image %}" alt="{{ member.name }} — {{ member.position }}" loading="lazy" decoding="async">
     {% endif %}
     <div class="home-team-card__overlay">
      <span class="home-team-card__name">{{ member.name }}</span>
      <span class="home-team-card__position">{{ member.position }}</span>
     </div>
    </div>
   </article>
   {% endfor %}
  </div>
 </div>
</section>
{% endif %}
